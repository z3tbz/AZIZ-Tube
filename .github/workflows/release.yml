name: Release

# A tag like v1.5 pushed: a release made from the installers in the release folder.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/AZIZ-Tube-Full-Setup.exe \
            release/AZIZ-Tube-Setup.exe \
            --title "AZIZ Tube ${GITHUB_REF_NAME#v}" \
            --notes-file release/NOTES.md \
            --latest
