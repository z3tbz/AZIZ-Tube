name: Release

# The installers in the release folder changed on main: a release made from them, named by release/VERSION (the tag is
# made by the release itself). Can also be run by hand from the Actions tab.
on:
  push:
    branches:
      - main
    paths:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(tr -d '[:space:]' < release/VERSION)"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            release/AZIZ-Tube-Full-Setup.exe \
            release/AZIZ-Tube-Setup.exe \
            release/AZIZ-Tube-Android.apk \
            release/AZIZ-Tube-Linux-x64.tar.gz \
            --target "$GITHUB_SHA" \
            --title "AZIZ Tube ${TAG#v}" \
            --notes-file release/NOTES.md \
            --latest
